name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: automationlab
          POSTGRES_PASSWORD: automationlab
          POSTGRES_DB: automationlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U automationlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://automationlab:automationlab@127.0.0.1:5432/automationlab
      SESSION_SECRET: ci-secret-not-used-outside-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Before the tests, not after: applying them proves they run in order on an
      # empty database, and it gives the overlay test a schema to run against.
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
