# Reprint the document set after a change to how a document is printed.
#
# The seed workflow is the wrong tool for a template edit: it rebuilds the
# transaction set, which clears the work everyone has in flight, because the
# rows they were working against stop existing. After a template change the rows
# are fine and only the paper is stale, so this re-renders each document in
# place — same blob key, same filename, new bytes — and touches no data.
#
# It runs here for the same reasons the seed does: a runner has Chromium, a
# six-hour ceiling and the credentials as repository secrets, and a laptop lid
# closing halfway through is not a failure mode anybody needs.
#
# Run it from the Actions tab. Never on a push: reprinting is a decision.
name: Reprint the document set

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only count what would be reprinted"
        type: boolean
        default: true
      kind:
        description: "One document kind (prefix match, e.g. invoice). Blank means all of them."
        type: string
        default: ""
      all_tenants:
        description: "Participants' own documents too, not just the shared master set"
        type: boolean
        default: false

concurrency:
  # A reprint and a seed writing the same documents would interleave.
  group: seed
  cancel-in-progress: false

jobs:
  reprint:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BLOB_STORE: s3
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION || 'auto' }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # playwright-core carries no browser. The fonts do travel with the
      # repository, embedded into the templates, so Arabic cannot come out here
      # as empty boxes.
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Check the credentials first
        run: |
          missing=0
          for v in DATABASE_URL S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::repository secret $v is not set"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          # Writes one object, reads it back, compares the bytes, deletes it.
          pnpm blob:check

      - name: Reprint
        run: pnpm docs:reprint ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.all_tenants && '--all' || '' }} ${{ inputs.kind != '' && format('--kind={0}', inputs.kind) || '' }}

      - name: What is on file now
        if: success() && !inputs.dry_run
        run: |
          node -e '
            const { Pool } = require("pg");
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            pool.query(`
              select level, count(*) files, pg_size_pretty(sum(size_bytes)) size,
                     max(rendered_at) newest
              from document_files group by level order by level
            `).then(async (r) => {
              console.table(r.rows);
              await pool.end();
            }).catch((e) => { console.error(e.message); process.exit(0); });
          '
